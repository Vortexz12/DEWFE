<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muda Cor de Fundo</title>
</head>
<body>
    <button id="red" onclick="mudaCor('red')">red</button>
    <button id="green" onclick="mudaCor('green')">green</button>
    <button id="blue" onclick="mudaCor('blue')">blue</button>
    <script>
        function mudaCor(cor) {
            document.body.style.backgroundColor= cor;
        }
    </script>
</body> 

</html>
