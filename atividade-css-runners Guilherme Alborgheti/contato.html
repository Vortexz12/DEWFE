<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Runners Area</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a id="logo" href="index.html" aria-label="Voltar para a página inicial">
      <img id="logo-img" src="assets/logo-runner.png" alt="Logo Runners Area">
      <h1>Runners Area</h1>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="contato.html">Contato</a>
      <a href="cadastro.html">Cadastro</a>
    </nav>
  </header>

  <main class="pagina-contato">
    <section class="card contato-info">
      <h2>Informações de Contato</h2>
      <p><strong>Email:</strong> contato@site.com</p>
      <p><strong>Telefone:</strong> (11) 1234-5678</p>
      <p><strong>Endereço:</strong> Rua Exemplo, 123 - São Paulo, SP</p>
    </section>

    <section class="card formulario">
      <h2>Formulário de Contato</h2>

      <form action="#" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem"></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Runners Area. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
