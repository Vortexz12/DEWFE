<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Runners Area</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a id="logo" href="index.html" aria-label="Voltar para a página inicial">
      <img id="logo-img" src="assets/logo-runner.png" alt="Logo Runners Area">
      <h1>Runners Area</h1>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="contato.html">Contato</a>
      <a href="cadastro.html">Cadastro</a>
    </nav>
  </header>

  <main class="pagina-cadastro">
    <section class="card formulario cadastro">
      <h2>Formulário de Cadastro</h2>

      <form action="#" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha">

        <label for="confirmar-senha">Confirmar Senha:</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha">

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone">

        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento" name="nascimento">

        <label class="termos" for="termos">
          <input type="checkbox" id="termos" name="termos">
          Concordo com os termos e condições
        </label>

        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Runners Area. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
