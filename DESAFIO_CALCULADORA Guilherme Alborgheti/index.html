<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">
    <h1>Calculadora</h1>

    <div class="display">
      <input type="text" id="display" disabled value="0" aria-label="Resultado">
    </div>

    <div class="buttons">
      <button class="btn clear" id="limpar">C</button>
      <button class="btn operator" data-value="/" id="div">&divide;</button>
      <button class="btn operator" data-value="*" id="mult">&times;</button>
      <button class="btn operator" data-value="-" id="sub">&minus;</button>

      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn operator" data-value="+" id="add">+</button>

      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn equals" id="calcular">=</button>

      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn zero" data-value="0">0</button>

      <button class="btn decimal" data-value=".">.</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
