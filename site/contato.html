<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Contato - Minecraft Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo"><img src="logo.jpg" alt="Logo Minecraft" id="minecraft-logo">
        <nav><ul><li><a href="sobre.html">Sobre</a></li><li><a href="servicos.html">Serviços</a></li><li><a href="contato.html">Contato</a></li></ul></nav>
    </header>

    <main>
        <h1>Fale Conosco</h1>
        <p>Mande um pergaminho (ou um e-mail) para nossa equipe!</p>
        <form style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <input type="text" placeholder="Seu Nome/Nick">
            <input type="email" placeholder="Seu Melhor E-mail">
            <textarea placeholder="Como podemos ajudar?" rows="4"></textarea>
            <button type="button">Enviar Mensagem</button>
        </form>
    </main>

    <audio id="break-sound" src="https://myinstants.com"></audio>
    <script>
        const logo = document.getElementById('minecraft-logo');
        const sound = document.getElementById('break-sound');
        logo.addEventListener('click', (e) => { e.preventDefault(); sound.play(); setTimeout(() => { window.location.href = "index.html"; }, 400); });
    </script>
</body>
</html>
